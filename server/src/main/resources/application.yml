spring:
  # 三个 @Scheduled 默认共用单线程：任一任务卡住（DB 锁等待）其余永久不再执行，
  # 而巡检恰是"备份 24h 未成功"的唯一告警源——运维闸门不能与被监控任务共命运
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: hip-server
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/hip
    username: hip
    password: hip123456
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 实施段 V10000+ 落库后，平台下一版的 V59 会被默认 outOfOrder=false 判为乱序而拒绝启动——
    # "已实施医院第一次平台升级即卡死在停服窗口"（1.1.9 B-13）。两段版本号不相交，风险可控。
    out-of-order: true

server:
  # 容器化部署经 nginx 反代：不设此项则审计里的 client_ip 恒为网关容器地址
  forward-headers-strategy: framework
  port: 8080

hip:
  security:
    # 安全基线：生产/试点通过环境变量 HIP_JWT_SECRET 注入（≥32 字符随机串）；
    # 未注入时回落开发占位值，仅限本机开发与 CI
    jwt-secret: ${HIP_JWT_SECRET:dev-only-secret-change-me-hip-platform-0123456789}
    jwt-expiry-hours: 12
  integration:
    mllp-enabled: true
    mllp-port: 2575
    # 来源白名单（逗号分隔，支持 CIDR）；pilot/prod 下留空则拒绝启动监听（fail closed）
    mllp-allow: ${HIP_MLLP_ALLOW:}
    mllp-bind: ${HIP_MLLP_BIND:0.0.0.0}
    pacs-url: http://127.0.0.1:8042
    ai-url: http://127.0.0.1:8100

management:
  endpoints:
    web:
      exposure:
        include: health,info
