spring:
  application:
    name: hip-server
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/hip
    username: hip
    password: hip123456
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

hip:
  security:
    # 生产环境务必通过环境变量 HIP_SECURITY_JWT_SECRET 覆盖
    jwt-secret: dev-only-secret-change-me-hip-platform-0123456789
    jwt-expiry-hours: 12

management:
  endpoints:
    web:
      exposure:
        include: health,info
