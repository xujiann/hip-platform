spring:
  application:
    name: hip-server-test
  # 测试显式声明 test profile（上线前审查 P2-1）：isProduction 改 fail-closed 后，
  # 空 profile 被当生产、拒占位密钥会让全部上下文加载失败。test 是显式非生产形态。
  # 需要验证 pilot/prod 闸门的用例（Phase109/112）在类内自设 profile，不受此默认影响。
  profiles:
    active: test
  datasource:
    hikari:
      # 会话时区钉死业务时区（1.2.2）：PGJDBC 默认把 JVM 时区设为会话时区，
      # 宿主/容器时区漂移时 `?::date`/`current_date` 的日窗口会偏移 8 小时，
      # 与 BusinessDates 的北京"今天"错位（UTC runner 的 CI 在北京 0-8 点实测现形）。
      # 有此设置后应用对宿主时区免疫，UTC 的 CI 即是常驻回归金丝雀。
      connection-init-sql: set time zone 'Asia/Shanghai'
    url: jdbc:postgresql://127.0.0.1:5432/hip_test
    username: hip
    password: hip123456
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 0
  # 与生产一致（1.2.3）：缺失时 XFF 不解析，防爆破细锁的 IP 维度在测试里失真
  forward-headers-strategy: framework

hip:
  audit:
    anon-throttle-ms: 0
  security:
    jwt-secret: test-only-secret-hip-platform-0123456789abcdef
    jwt-expiry-hours: 1
  integration:
    mllp-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
