name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端测试（mvn test）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hip_test
          POSTGRES_USER: hip
          POSTGRES_PASSWORD: hip123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hip -d hip_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 运行测试
        run: mvn -B --no-transfer-progress test

  frontend-build:
    name: 前端构建（vue-tsc + vite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/shell/package-lock.json

      - name: 安装依赖并构建
        working-directory: frontend/shell
        run: |
          npm ci
          npm run build

  e2e:
    name: 端到端回归（完整后端）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hip
          POSTGRES_USER: hip
          POSTGRES_PASSWORD: hip123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hip -d hip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建后端
        run: mvn -B --no-transfer-progress -DskipTests package

      - name: 启动后端并等待就绪
        run: |
          nohup java -jar server/target/hip-server-*.jar --spring.profiles.active=dev > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 2
          done
          curl -sf http://localhost:8080/actuator/health || { tail -50 server.log; exit 1; }

      - name: 准备基础数据（全新库需要 1 号/2 号患者）
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          BASE = 'http://localhost:8080/api'
          def call(m, p, b=None, t=None):
              r = urllib.request.Request(BASE + p, method=m)
              r.add_header('Content-Type', 'application/json')
              if t: r.add_header('Authorization', 'Bearer ' + t)
              return json.loads(urllib.request.urlopen(r, data=json.dumps(b).encode()).read().decode())
          # 登录带重试：服务刚就绪时偶发瞬时错误（连接池预热等）曾致误报
          import time
          t = None
          for i in range(5):
              resp = call('POST', '/auth/login', {'username': 'admin', 'password': 'admin123'})
              if resp.get('code') == 0:
                  t = resp['data']['token']
                  break
              print('login retry', i + 1, resp)
              time.sleep(3)
          assert t, '登录重试 5 次仍失败'
          call('POST', '/patients', {'name': 'Test', 'sex': 'U', 'idType': 'OTHER'}, t)
          p2 = call('POST', '/patients', {'name': '张三', 'sex': 'M', 'idType': 'ID_CARD',
                                          'idNo': '510181199003078511', 'phone': '13800138000',
                                          'insuranceType': 'YB_RESIDENT'}, t)
          assert p2['data']['patientNo'] == 'P00000002', p2
          EOF

      - name: 启动 ai-service（phase1821 AI 建议依赖）
        run: |
          pip3 install -q -r ai-service/requirements.txt
          (cd ai-service && nohup python3 -m uvicorn main:app --port 8100 > ../ai.log 2>&1 &)
          for i in $(seq 1 15); do curl -sf http://localhost:8100/docs > /dev/null && break; sleep 1; done
          curl -sf http://localhost:8100/docs > /dev/null || { echo "ai-service 未就绪："; cat ../ai.log || cat ai.log; exit 1; }

      - name: 运行全部 E2E 套件（28 套）
        run: |
          python3 tools/e2e-outpatient.py
          python3 tools/e2e-inpatient.py
          python3 tools/e2e-integration.py
          python3 tools/e2e-mllp.py
          python3 tools/e2e-phase3.py
          python3 tools/e2e-phase48.py
          python3 tools/e2e-emr-stats.py
          python3 tools/e2e-phase912.py
          python3 tools/e2e-phase1316.py
          python3 tools/e2e-phase1821.py
          python3 tools/e2e-phase2226.py
          python3 tools/e2e-insurance.py
          python3 tools/e2e-drg-cdss.py
          python3 tools/e2e-phase2931.py
          python3 tools/e2e-phase3234.py
          python3 tools/e2e-phase3537.py
          python3 tools/e2e-phase38.py
          python3 tools/e2e-phase3940.py
          python3 tools/e2e-product1.py
          python3 tools/e2e-101.py
          # v32：这三套 v30/v31 就写好但一直漏接 CI（药事全链/临床收尾/病历补正）——
          # 交付一致性收口，自成一体（各自建患者），置于末尾与本地全新库验证顺序一致
          python3 tools/e2e-pharmacy-chain.py
          python3 tools/e2e-clinical-closure.py
          python3 tools/e2e-emr-closure.py
          python3 tools/e2e-critical-value.py
          python3 tools/e2e-emr-consent.py
          python3 tools/e2e-lis-qc.py
          python3 tools/e2e-outp-appt.py
          python3 tools/e2e-long-order.py

      - name: 失败时输出服务端日志
        if: failure()
        run: |
          echo "===== server.log ====="; tail -150 server.log
          echo "===== ai.log ====="; tail -50 ai.log 2>/dev/null || echo "(无 ai.log)"

  pilot-guard:
    name: 生产闸门冒烟（pilot profile）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hip
          POSTGRES_USER: hip
          POSTGRES_PASSWORD: hip123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hip -d hip"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建
        run: mvn -B --no-transfer-progress -DskipTests package

      # 1.0.9 教训：两道安全闸门（JWT 密钥、Mock 适配器）自实现起从未被任何自动化路径执行过，
      # 因为编排与 CI 都不设 profile。这个作业就是那条缺失的覆盖。
      - name: 缺 HIP_JWT_SECRET 时必须拒绝启动
        env:
          HIP_DB_URL: jdbc:postgresql://localhost:5432/hip
          HIP_DB_USER: hip
          HIP_DB_PASSWORD: hip123456
        run: |
          set +e
          timeout 90 java -jar server/target/hip-server-*.jar --spring.profiles.active=pilot             > pilot-nokey.log 2>&1
          set -e
          # 匹配 JWT 闸门的完整文案：裸 grep "拒绝启动" 会被 MLLP 白名单闸门的同前缀日志误命中
          if grep -q "拒绝启动：pilot/prod profile 必须注入 HIP_JWT_SECRET" pilot-nokey.log; then
            echo "OK：占位密钥被拒绝"
          else
            echo "FAIL：pilot profile 未拦住开发占位密钥（若日志是别的启动错误，说明本作业环境不对）"
            tail -60 pilot-nokey.log; exit 1
          fi

      - name: 带密钥但仍用 Mock 适配器时必须拒绝启动
        env:
          HIP_JWT_SECRET: ci-only-strong-secret-0123456789abcdefghijklmnop
          HIP_DB_URL: jdbc:postgresql://localhost:5432/hip
          HIP_DB_USER: hip
          HIP_DB_PASSWORD: hip123456
        run: |
          set +e
          timeout 90 java -jar server/target/hip-server-*.jar --spring.profiles.active=pilot             > pilot-mock.log 2>&1
          set -e
          if grep -q "拒绝在 pilot/prod 运行 Mock 适配器" pilot-mock.log; then
            echo "OK：Mock 适配器被拒绝"
          else
            echo "FAIL：pilot profile 未拦住 Mock 适配器"; tail -40 pilot-mock.log; exit 1
          fi
