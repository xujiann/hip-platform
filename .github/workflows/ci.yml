name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: 后端测试（mvn test）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hip_test
          POSTGRES_USER: hip
          POSTGRES_PASSWORD: hip123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hip -d hip_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 运行测试
        run: mvn -B --no-transfer-progress test

  frontend-build:
    name: 前端构建（vue-tsc + vite）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/shell/package-lock.json

      - name: 安装依赖并构建
        working-directory: frontend/shell
        run: |
          npm ci
          npm run build
