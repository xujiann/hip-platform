services:
  postgres:
    image: postgres:16-alpine
    container_name: hip-postgres
    environment:
      POSTGRES_DB: hip
      POSTGRES_USER: hip
      POSTGRES_PASSWORD: hip123456
    ports:
      - "5432:5432"
    volumes:
      - hip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hip -d hip"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hip-redis
    ports:
      - "6379:6379"
    volumes:
      - hip-redisdata:/data

volumes:
  hip-pgdata:
  hip-redisdata:
