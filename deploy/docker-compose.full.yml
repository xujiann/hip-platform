# 全栈容器化编排（生产/试点）
# 用法：在仓库根目录 docker compose -f deploy/docker-compose.full.yml up -d --build
# 说明：开发机 Docker Desktop 不稳定时仍用 tools/dev-start.ps1（WSL postgres），本编排面向服务器部署。
#
# **必须先设置环境变量**（缺失即拒绝启动，不提供默认值——审阅 A-1：
# 默认值兜底会让「忘配」变成「静默用公开口令/占位密钥」）：
#   export HIP_DB_PASSWORD=<强口令>
#   export HIP_JWT_SECRET=$(openssl rand -base64 48)
# 时区固定 Asia/Shanghai：容器默认 UTC 会让 ::date 归日与 @Scheduled 触发时刻整体偏 8 小时。
# v29 P2-7：移除了 redis 服务——全库无任何 Redis 用法（选主用 PG advisory lock、
# 登录锁定用 sys_user 列），强制运维为幽灵依赖维护强口令是负担。多实例若日后需共享
# 缓存/限流再真正接入，届时一并加回服务与闸门。
x-tz: &tz
  TZ: Asia/Shanghai

# 每个服务共用的日志上限：Docker 默认 json-file 不轮转、无大小上限——
# 医院机房"某个坏日"的循环抛栈能把 /var/lib/docker 写满，pg 与应用一起挂（v29 P1-2）。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz
      POSTGRES_DB: hip
      POSTGRES_USER: hip
      POSTGRES_PASSWORD: ${HIP_DB_PASSWORD:?必须设置 HIP_DB_PASSWORD}
      # 初始化时即固定库时区，避免 ::date 按 UTC 归日
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=zh-CN"
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    volumes:
      - hip-pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    # 只监听本机回环：数据库不应暴露到宿主全网卡
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hip -d hip"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 数据库定时备份（v29 P1-1）：db-backup.ps1 是 Windows+WSL 开发态脚本，
  # Linux 机房用不了——生产备份必须随 compose 一起交付，否则三个月零备份。
  # 每日 02:30（容器 TZ 已固定北京时）pg_dump -Fc 落到与 pg 共享的 ./backups 卷，
  # 保留 14 份。异地外传（rsync/对象存储）留给实施按院配置——见部署手册。
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz
      PGPASSWORD: ${HIP_DB_PASSWORD:?必须设置 HIP_DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./tools/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz
      # pilot profile 是两道安全闸门（JwtService 密钥校验、MockAdapterGuard）的触发条件，
      # 缺失会让闸门静默跳过——审阅 A-1，务必保留
      SPRING_PROFILES_ACTIVE: pilot
      HIP_JWT_SECRET: ${HIP_JWT_SECRET:?必须设置 HIP_JWT_SECRET（≥32 位随机串）}
      HIP_DB_URL: jdbc:postgresql://postgres:5432/hip
      HIP_DB_USER: hip
      HIP_DB_PASSWORD: ${HIP_DB_PASSWORD:?必须设置 HIP_DB_PASSWORD}
      HIP_AI_URL: http://ai-service:8100
      HIP_MLLP_ENABLED: ${HIP_MLLP_ENABLED:-false}
      # MLLP 无协议级鉴权：开启时必须同时给出 LIS/中间件的来源 IP 白名单（支持 CIDR），
      # pilot/prod 下留空会拒绝启动监听（fail closed）
      HIP_MLLP_ALLOW: ${HIP_MLLP_ALLOW:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
      # 检验设备 MLLP 通道（hip.integration.mllp-enabled=true 时才需要）
      - "2575:2575"
    # 文件日志落宿主可监控分区（v29 P1-3）：容器易失层里的日志重建即丢、巡检也取不到
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g

  ai-service:
    build: ../ai-service
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz

  frontend:
    build: ../frontend/shell
    restart: unless-stopped
    logging: *default-logging
    environment:
      <<: *tz
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"

  # 影像归档（PACS，选装）：与 WSL 安装版二选一
  orthanc:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    environment:
      <<: *tz
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      # 默认口令 orthanc/orthanc 会让影像库任人调阅
      ORTHANC__REGISTERED_USERS: |
        {"hip": "${HIP_ORTHANC_PASSWORD:?启用 pacs profile 时必须设置 HIP_ORTHANC_PASSWORD}"}
    ports:
      - "127.0.0.1:8042:8042"
      - "4242:4242"
    volumes:
      - hip-orthanc:/var/lib/orthanc/db
    profiles: ["pacs"]

volumes:
  hip-pgdata:
  hip-orthanc:
